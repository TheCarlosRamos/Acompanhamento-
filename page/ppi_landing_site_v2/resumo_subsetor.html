<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PPI • Resumo por Subsetor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ppi.css" />
  <style>
    .subsetor-header {
      background: linear-gradient(135deg, #1e40af 0%, #3730a3 100%);
      color: white;
      padding: 2rem 0;
      width: 100%;
    }
    .subsetor-header .header__inner {
      max-width: none;
      margin: 0;
      padding: 0;
      width: 100%;
    }
    .stats-container {
      display: flex;
      gap: 2rem;
      align-items: stretch;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .etapas-stats {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 2.5rem;
      border-radius: 1rem;
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
    }
    .etapas-stats h3 {
      font-size: 1.8rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    .etapas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1.5rem;
      flex: 1;
    }
    .etapa-stat {
      background: rgba(255, 255, 255, 0.15);
      padding: 1.5rem;
      border-radius: 0.75rem;
      text-align: center;
    }
    .etapa-stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .etapa-stat-label {
      font-size: 0.85rem;
      opacity: 0.8;
    }
    .folha-section.pdf-export {
      background: #1e40af !important;
      position: relative;
    }
    .folha-section.pdf-export * {
      color: white !important;
      font-family: Arial, sans-serif !important;
    }
    .folha-section.pdf-export .card {
      background: rgba(255, 255, 255, 0.95) !important;
      color: #1f2937 !important;
      font-family: Arial, sans-serif !important;
    }
    .folha-section.pdf-export .card * {
      color: #1f2937 !important;
      font-family: Arial, sans-serif !important;
    }
    .folha-section {
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .folha-section .header__inner {
      max-width: none;
      margin: 0;
      padding: 0 2rem;
      width: 100%;
    }
    .section-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1f2937;
      margin: 3rem 0 1.5rem 0;
      padding-bottom: 0.5rem;
      border-bottom: 3px solid #e5e7eb;
    }
    .section-title:first-child {
      margin-top: 0;
    }
    .favorites-section {
      background: #f8fafc;
      border-radius: 1rem;
      padding: 2rem;
      margin: 2rem 0;
    }
    .favorites-empty {
      text-align: center;
      padding: 3rem;
      color: #6b7280;
    }
    .favorites-empty h3 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #374151;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: #6b7280;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid #1e40af;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .back-navigation {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 1rem 0;
      margin-bottom: 2rem;
    }
    .back-navigation .header__inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      text-decoration: none;
      color: #374151;
      font-weight: 500;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: #e5e7eb;
    }
    .export-btn {
      padding: 0.5rem 1rem;
      background: #1e40af;
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .export-btn:hover {
      background: #1e3a8a;
    }
    .subsetor-selector {
      background: white;
      padding: 1.5rem;
      border-radius: 1rem;
      margin-bottom: 2rem;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
    }
    .subsetor-selector select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 1rem;
      background: white;
    }
    .view-cards-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin: 1rem 0;
    }
    .view-cards-btn:hover {
      background: #059669;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
    }
    .modal-content {
      background-color: white;
      margin: 0.5% auto;
      padding: 2rem;
      border-radius: 1rem;
      width: 99%;
      max-width: 1800px;
      max-height: 98vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #e5e7eb;
    }
    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2937;
    }
    .close-modal {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
    }
    .close-modal:hover {
      background: #e5e7eb;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
      width: 100%;
      align-items: stretch;
    }
    
    @media (min-width: 1200px) {
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    
    @media (min-width: 1600px) {
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    
    #modalCardsContainer .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
      width: 100%;
      align-items: stretch;
    }
    
    @media (min-width: 1400px) {
      #modalCardsContainer .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (min-width: 1800px) {
      #modalCardsContainer .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (min-width: 2200px) {
      #modalCardsContainer .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .modal-navigation {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #e5e7eb;
    }
    .modal-nav-btn {
      background: #1e40af;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 500;
    }
    .modal-nav-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .modal-nav-btn:not(:disabled):hover {
      background: #1e3a8a;
    }
    .modal-info {
      text-align: center;
      color: #6b7280;
      font-size: 0.875rem;
      margin: 1rem 0;
    }
  </style>
  <script src="favorites-api.js"></script>
</head>
<body>
  <header class="back-navigation">
    <div class="header__inner">
      <nav>
        <a href="lista_projetos.html" class="back-btn">
          <span>←</span> Voltar para Lista
        </a>
      </nav>
      <button class="export-btn" onclick="exportToPDF()">
        <span>📄</span> Exportar Resumo
      </button>
    </div>
  </header>

  <div class="subsetor-selector">
    <div class="header__inner">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: end;">
        <div>
          <label for="subsecretariaSelect" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #374151;">
            Selecione a Subsecretaria:
          </label>
          <select id="subsecretariaSelect" onchange="changeSubsecretaria()" style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 1rem; background: white;">
            <option value="">Carregando subsecretarias...</option>
          </select>
        </div>
        <div>
          <label for="subsetorSelect" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #374151;">
            Selecione o Subsetor:
          </label>
          <select id="subsetorSelect" onchange="changeSubsetor()" style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 1rem; background: white;">
            <option value="">Primeiro selecione uma subsecretaria</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Carregando dados dos subsetores...</p>
    </div>
  </div>

  <!-- Modal para visualização de cards -->
  <div id="cardsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Projetos do Subsetor</h2>
        <button class="close-modal" onclick="closeModal()">✕ Fechar</button>
      </div>
      <div class="modal-info" id="modalInfo">Mostrando projetos 1-15 de 0</div>
      <div id="modalCardsContainer" class="cards-grid">
        <!-- Cards serão inseridos aqui -->
      </div>
      <div class="modal-navigation">
        <button class="modal-nav-btn" id="prevBtn" onclick="changeModalPage(-1)" disabled>← Anterior</button>
        <button class="modal-nav-btn" id="nextBtn" onclick="changeModalPage(1)" disabled>Próximo →</button>
      </div>
    </div>
  </div>

  <!-- Modal para detalhes do projeto -->
  <div id="projectModal" class="modal">
    <div class="modal-content" style="max-width: 1200px; max-height: 90vh; overflow-y: auto; width: 95vw;">
      <div class="modal-header">
        <h2 class="modal-title" id="projectModalTitle">Detalhes do Projeto</h2>
        <button class="close-modal" onclick="closeProjectModal()">✕ Fechar</button>
      </div>
      <div id="projectModalContent">
        <!-- Conteúdo do projeto será inserido aqui -->
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Leaflet para mini-mapas -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-image@0.4.0/leaflet-image.js"></script>
  
  <script>
    // Funções utilitárias
    const $ = (s,root=document)=>root.querySelector(s);
    const $$ = (s,root=document)=>Array.from(root.querySelectorAll(s));
    
    function esc(text){
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Dicionário de traduções
    const translations = {
      'Highway': 'Rodovia',
      'Seaport': 'Porto Marítimo',
      'Intercity Rail': 'Ferrovia Intercidades',
      'School': 'Escola',
      'Solid Waste Facility': 'Instalação de Resíduos Sólidos',
      'Street Lighting': 'Iluminação Pública',
      'Other Water & Waste': 'Outros Água e Resíduos',
      'Other Energy': 'Outra Energia',
      'Other': 'Outros',
      'Airport': 'Aeroporto',
      'Hospital': 'Hospital',
      'Housing': 'Habitação',
      'Irrigation': 'Irrigação',
      'Metro': 'Metrô',
      'Other Transport': 'Outro Transporte',
      'Prison': 'Penitenciária',
      'Tourist Facility': 'Instalação Turística',
      'Transmission Line': 'Linha de Transmissão',
      'Waste Water Treatment': 'Tratamento de Águas Residuais',
      'Water Supply Infrastructure': 'Infraestrutura de Abastecimento de Água',
      'Transport': 'Transporte',
      'Social Infrastructure': 'Infraestrutura Social',
      'Water & Waste': 'Água e Resíduos',
      'Urban Services': 'Serviços Urbanos',
      'Energy': 'Energia',
      'Completed': 'Concluído',
      'In Progress': 'Em Andamento',
      'Not Started': 'Não Iniciado',
      'Pending': 'Pendente',
      'Active': 'Ativo',
      'Inactive': 'Inativo',
      'Em execução': 'Em execução',
      'Concluído': 'Concluído',
      'Paralisado': 'Paralisado',
      'Em andamento': 'Em andamento',
      'Planejado': 'Planejado',
      'Cancelado': 'Cancelado',
      'Suspenso': 'Suspenso'
    };

    function translate(text) {
      if (!text) return text;
      return translations[text] || text;
    }
    
    function resumirDescricao(texto, maxCaracteres = 300) {
      if (!texto) return '';
      if (texto.length <= maxCaracteres) return texto;
      const cortado = texto.substring(0, maxCaracteres);
      const ultimoEspaco = cortado.lastIndexOf(' ');
      return (ultimoEspaco > maxCaracteres * 0.7) 
        ? cortado.substring(0, ultimoEspaco) + '...'
        : cortado + '...';
    }

    const phaseCols = [
      ['Estudos','status_dos_estudos'],['Consulta Pública','status_consulta_publica'],['TCU','status_do_tcu'],['Edital','status_do_edital'],['Leilão','status_do_leilao'],['Contrato','status_do_contrato']
    ];
    
    function lastCompletedIdx(rec){ 
      let last=-1; 
      for(let i=0;i<phaseCols.length;i++){ 
        const v=(rec[phaseCols[i][1]]||'').toString().toLowerCase(); 
        if(v.includes('conclu')||v.includes('completed')||v.includes('assinado')||v.includes('assinatura')) last=i;
      } 
      return last; 
    }
    
    function timelineHTML(rec){ 
      const states = phaseCols.map(_=>false); 
      const last = lastCompletedIdx(rec); 
      if(last >= 0){ 
        for(let i = 0; i <= last; i++) states[i] = true; 
      } 
      const completed = states.filter(Boolean).length; 
      const width = (completed/phaseCols.length*100).toFixed(2) + '%'; 
      
      const items = phaseCols.map((p, i) => {
        const isCompleted = states[i];
        const isCurrent = i === last + 1 && last >= 0;
        
        let statusClass = '';
        let statusIcon = '';
        let statusText = '';
        
        if (isCompleted) {
          statusClass = 'completed';
          statusIcon = '✓';
          statusText = 'Concluído';
        } else if (isCurrent) {
          statusClass = 'current';
          statusIcon = '';
          statusText = rec[phaseCols[i][1]] || 'Em andamento';
        } else {
          statusText = 'Pendente';
        }
        
        return `<div class="phase-item group" data-phase="${p[0].toLowerCase().replace(/\s+/g, '-')}" style="min-width: 40px;">
          <div class="phase-dot ${statusClass}" title="${p[0]}: ${statusText}" style="width: 12px; height: 12px; font-size: 8px;">
            ${statusIcon}
          </div>
          <div class="phase-label ${statusClass}" style="font-size: 8px; line-height: 1;">
            <span class="font-medium" style="font-size: 8px;">${p[0]}</span>
          </div>
        </div>`;
      }).join('');
      
      return `<div class="phase-timeline" style="height: 40px;">
        <div class="phase-line"></div>
        <div class="phase-line-completed" style="width: ${width}"></div>
        <div class="phase-items" style="display: flex; justify-content: space-between; align-items: flex-end; height: 100%;">${items}</div>
      </div>`;
    }

    function cardTemplate(p){ 
      const nome = p.nome_completo || p.nome_projeto || 'Projeto';
      const isFavorite = favorites.includes(p.guid);
      
      return `<article class="card" style="padding: 0.8rem; min-height: 120px; display: flex; flex-direction: column; position: relative; cursor: pointer; width: 100%;" onclick="openProjectModal('${p.guid}')">
        <div style="flex: 0 0 auto; margin-bottom: 0.5rem;">
          <h3 style="color: #1f2937; font-size: 16px; margin: 0; font-weight: 700; line-height: 1.3;">${esc(nome)}</h3>
        </div>

        <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-end;">
          <div style="transform: scale(0.75); transform-origin: top left; margin-left: -8px;">
            ${timelineHTML(p)}
          </div>
        </div>
        
        <button onclick="event.stopPropagation(); toggleFavorite('${p.guid}')" style="position: absolute; bottom: 0.5rem; right: 0.5rem; background: ${isFavorite ? '#fbbf24' : 'rgba(255,255,255,0.2)'}; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="${isFavorite ? '#fff' : '#fff'}" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </button>
      </article>`;
    }

    let allProjects = [];
    let favorites = [];
    let currentSubsetor = '';
    let currentSubsecretaria = '';
    let subsetores = [];
    let subsecretarias = [];
    let modalProjects = [];
    let currentModalPage = 0;
    let currentProjectsPage = 0;
    
    function getCardsPerPage() {
      const width = window.innerWidth;
      if (width >= 1600) return 18;
      if (width >= 1200) return 18;
      return 15;
    }
    
    let CARDS_PER_PAGE = getCardsPerPage();
    
    window.addEventListener('resize', () => {
      const newCardsPerPage = getCardsPerPage();
      if (newCardsPerPage !== CARDS_PER_PAGE) {
        CARDS_PER_PAGE = newCardsPerPage;
        if (currentSubsetor) {
          currentProjectsPage = 0;
          renderSubsetorContent();
        }
      }
    });

    document.addEventListener('DOMContentLoaded', async function() {
      await loadFavorites();
      await loadProjects();
      setupSubsetorSelector();
    });

    async function loadFavorites() {
      favorites = await window.favoritesApi.loadFavorites();
    }

    async function loadProjects() {
      try {
        const response = await fetch('api/projects.php');
        allProjects = await response.json();
        
        subsetores = [...new Set(allProjects.map(p => p.subsetor).filter(Boolean))].sort();
        console.log('Subsetores encontrados:', subsetores);
        
        subsecretarias = [...new Set(allProjects.map(p => p.subsecretaria).filter(Boolean))].sort();
        console.log('Subsecretarias encontradas:', subsecretarias);
        
      } catch (error) {
        console.error('Erro ao carregar projetos:', error);
        showError('Não foi possível carregar os projetos.');
      }
    }

    function setupSubsetorSelector() {
      const subsetorSelector = document.getElementById('subsetorSelect');
      const subsecretariaSelector = document.getElementById('subsecretariaSelect');
      
      subsecretariaSelector.innerHTML = '<option value="">Selecione uma subsecretaria...</option>';
      subsecretarias.forEach(subsecretaria => {
        const option = document.createElement('option');
        option.value = subsecretaria;
        option.textContent = subsecretaria;
        subsecretariaSelector.appendChild(option);
      });
      
      subsetorSelector.innerHTML = '<option value="">Primeiro selecione uma subsecretaria</option>';
      subsetorSelector.disabled = true;
      
      subsecretariaSelector.addEventListener('change', changeSubsecretaria);
      subsetorSelector.addEventListener('change', changeSubsetor);
    }

    function changeSubsecretaria() {
      const subsecretariaSelector = document.getElementById('subsecretariaSelect');
      const subsetorSelector = document.getElementById('subsetorSelect');
      
      currentSubsecretaria = subsecretariaSelector.value;
      currentSubsetor = '';
      
      if (!currentSubsecretaria) {
        subsetorSelector.innerHTML = '<option value="">Primeiro selecione uma subsecretaria</option>';
        subsetorSelector.disabled = true;
        showEmpty();
        return;
      }
      
      const availableSubsetores = [...new Set(
        allProjects
          .filter(p => p.subsecretaria === currentSubsecretaria)
          .map(p => p.subsetor)
          .filter(Boolean)
      )].sort();
      
      subsetorSelector.innerHTML = '<option value="">Selecione um subsetor...</option>';
      availableSubsetores.forEach(subsetor => {
        const option = document.createElement('option');
        option.value = subsetor;
        option.textContent = translate(subsetor);
        subsetorSelector.appendChild(option);
      });
      
      subsetorSelector.disabled = false;
      
      if (availableSubsetores.length === 1) {
        subsetorSelector.value = availableSubsetores[0];
        changeSubsetor();
      } else {
        showEmpty();
      }
    }

    function changeSubsetor() {
      const subsetorSelector = document.getElementById('subsetorSelect');
      currentSubsetor = subsetorSelector.value;
      
      if (!currentSubsetor) {
        showEmpty();
        return;
      }
      
      renderSubsetorContent();
    }

    function renderSubsetorContent() {
      const content = document.getElementById('content');
      
      let subsetorProjects = allProjects.filter(p => p.subsetor === currentSubsetor);
      
      if (currentSubsecretaria) {
        subsetorProjects = subsetorProjects.filter(p => p.subsecretaria === currentSubsecretaria);
      }
      
      const subsetorStats = calculateStats(subsetorProjects);
      const subsetorEtapasStatsHtml = Object.entries(subsetorStats.etapasStats).map(([etapa, count]) => `
        <div class="etapa-stat">
          <div class="etapa-stat-value">${count}</div>
          <div class="etapa-stat-label">${translate(etapa)}</div>

        subsetorFavorites.forEach((project, index) => {

          const desc = project.descricao_do_projeto || project.descricao_curta || '';
          const situ = project.status_atual_do_projeto || '—';
          const deliberacao = project.proximas_etapas || '—';
          const riscos = project.questoes_chaves || '';
          const lat = parseFloat(project.latitude), lon = parseFloat(project.longitude);
          
          const hasCoords = !isNaN(lat) && !isNaN(lon);
          const miniMapBlock = hasCoords

            : `

              <h5>Mapa</h5>

          const riscosList = riscos ? 
            riscos.split(/\n|;|•/).filter(x => x.trim()).map(x => `<li>${esc(x.trim())}</li>`).join('') : 
            '<li>Nenhum ponto de atenção identificado</li>';
          
          const completeCardHtml = `
            <article class="card" style="background: rgba(255, 255, 255, 0.95); color: #1f2937;">
              <div class="card-header">
                <div style="display: flex; justify-content: space-between; align-items: start;">
                  <div>
                    <p style="color: #6b7280; font-size: 14px; margin: 0 0 8px 0;">${esc(setor)}</p>
                    <h3 style="color: #1f2937; font-size: 20px; margin: 0; font-weight: 700;">${esc(nome)}</h3>
                  </div>
                </div>
              </div>

              <div class="project-info-grid">
                <div class="left-col">
                  <div class="info-large description">
                    <h4>Descrição</h4>
                    <p>${esc(desc)}</p>
                  </div>

                  <div class="row-2cols">
                    <div class="info-small">
                      <h5>Situação Atual</h5>
                      <p>${esc(translate(situ))}</p>
                    </div>

                    <div class="info-small">
                      <h5>Próximos Passos</h5>
                      <p>${esc(deliberacao)}</p>

                  <div class="info-large">
                    <h4>Pontos de Atenção</h4>
                    <ul class="list-disc list-inside space-y-1 text-gray-700">

                </div>

                <div class="right-col">
                  ${miniMapBlock}

            </article>
          `;
          
          folhasHtml.push(`
            <div class="folha-section" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 2rem 0; margin-bottom: 1rem; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
              <div class="header__inner">
                <div style="display: flex; gap: 2rem; align-items: flex-start;">
                  <div class="stats-container" style="margin-bottom: 1.5rem; min-width: 120px;">
                    <div class="etapas-stats" style="padding: 1rem;">
                      <h3 style="font-size: 1rem; margin-bottom: 0.5rem;">Favorito</h3>
                      <div class="etapas-grid" style="grid-template-columns: 1fr;">
                        <div class="etapa-stat" style="padding: 0.8rem;">
                          <div class="etapa-stat-value" style="font-size: 1.2rem;">${index + 1}</div>
                          <div class="etapa-stat-label" style="font-size: 0.7rem;">Projeto</div>
                        </div>
                      </div>
                    </div>

                  <section class="cards" aria-live="polite" style="flex: 1;">

      console.log('Total de folhas HTML geradas:', folhasHtml.length);
      
      if (folhasHtml.length === 0) {
        content.innerHTML = `
          <div class="loading">
            <h3>Nenhum projeto encontrado</h3>
            <p>Não há projetos para este subsetor.</p>
          </div>
        `;
        return;
      }
      
      content.innerHTML = `
        <div class="document-container">
          <div class="folhas-container">
            ${folhasHtml.join('')}
          </div>
        </div>
      `;
      
      console.log('Conteúdo renderizado no DOM');
      
      setTimeout(() => {
        console.log('Renderizando mapas nos favoritos...');
        renderMiniMaps();

    }

    function calculateStats(projects) {
      const completed = projects.filter(p => {
        const lastIdx = lastCompletedIdx(p);
        return lastIdx === phaseCols.length - 1;
      }).length;
      
      const inProgress = projects.filter(p => {
        const lastIdx = lastCompletedIdx(p);
        return lastIdx >= 0 && lastIdx < phaseCols.length - 1;
      }).length;
      
      const etapasStats = {};
      phaseCols.forEach(([phaseName, statusField]) => {
        etapasStats[phaseName] = 0;
      });
      
      projects.forEach(project => {
        const lastIdx = lastCompletedIdx(project);
        if (lastIdx >= 0) {
          const lastPhaseName = phaseCols[lastIdx][0];
          etapasStats[lastPhaseName]++;
        }
      });
      
      return {
        total: projects.length,
        favorites: projects.filter(p => favorites.includes(p.guid)).length,
        completed: completed,
        inProgress: inProgress,
        etapasStats: etapasStats
      };
    }

    function showEmpty() {
      document.getElementById('content').innerHTML = `
        <div class="loading">
          <h3>Selecione um subsetor</h3>
          <p>Escolha um subsetor no seletor acima para visualizar o resumo.</p>
        </div>
      `;
    }

    function showError(message) {
      document.getElementById('content').innerHTML = `
        <div class="loading">
          <h3>Erro</h3>
          <p>${message}</p>
        </div>
      `;
    }

    function renderProjectsGrid(projects, page) {
      const startIndex = page * CARDS_PER_PAGE;
      const endIndex = Math.min(startIndex + CARDS_PER_PAGE, projects.length);
      const currentPageProjects = projects.slice(startIndex, endIndex);
      
      const prevBtn = document.getElementById('projectsPrevBtn');
      const nextBtn = document.getElementById('projectsNextBtn');
      
      if (prevBtn) prevBtn.disabled = page === 0;
      if (nextBtn) nextBtn.disabled = endIndex >= projects.length;
      
      return `<div class="cards-grid" style="width: 100%;">
        ${currentPageProjects.map(project => cardTemplate(project)).join('')}
      </div>`;
    }

    function renderMiniMaps() {
      const maps = document.querySelectorAll('.mini-map');
      maps.forEach(el => {
        const lat = parseFloat(el.dataset.lat);
        const lon = parseFloat(el.dataset.lon);
        if (!isNaN(lat) && !isNaN(lon)) {
          const map = L.map(el, {
            center: [lat, lon],
            zoom: 5,
            zoomControl: false,
            attributionControl: false
          });
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          L.marker([lat, lon]).addTo(map);
          el._leaflet_map = map;
        }
      });
    }

    // Funções para modais
    function openProjectModal(guid) {
      const project = allProjects.find(p => p.guid === guid);
      if (!project) return;
      
      document.getElementById('projectModalTitle').textContent = project.nome_completo || project.nome_projeto || 'Projeto';
      
      const nome = project.nome_completo || project.nome_projeto || 'Projeto';
      const setor = translate(project.setor || '');
      const desc = project.descricao_do_projeto || project.descricao_curta || 'Sem descrição disponível';
      const situ = project.status_atual_do_projeto || '—';
      const deliberacao = project.proximas_etapas || '—';
      const riscos = project.questoes_chaves || '';
      const loc = project.localizacoes || 'Não informada';
      const lat = parseFloat(project.latitude), lon = parseFloat(project.longitude);
      
      const hasCoords = !isNaN(lat) && !isNaN(lon);
      
      document.getElementById('projectModalContent').innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
          <div>
            <h3 style="margin-bottom: 1rem;">${esc(nome)}</h3>
            <p><strong>Setor:</strong> ${esc(setor)}</p>
            <p><strong>Subsetor:</strong> ${esc(translate(project.subsetor || ''))}</p>
            <p><strong>Localização:</strong> ${esc(loc)}</p>
            <p><strong>Situação Atual:</strong> ${esc(translate(situ))}</p>
            <p><strong>Próximos Passos:</strong> ${esc(deliberacao)}</p>
            <div style="margin-top: 1rem;">
              <h4>Descrição</h4>
              <p>${esc(desc)}</p>
            </div>
          </div>
          <div>
            ${hasCoords ? `<div id="projectDetailMap" style="height: 300px; border-radius: 0.5rem;"></div>` : '<p>Localização não disponível</p>'}
            <div style="margin-top: 1rem;">
              <h4>Timeline de Etapas</h4>
              ${timelineHTML(project)}
            </div>
          </div>
        </div>
      `;
      
      document.getElementById('projectModal').style.display = 'block';
      
      if (hasCoords) {
        setTimeout(() => {
          const mapEl = document.getElementById('projectDetailMap');
          if (mapEl) {
            const map = L.map(mapEl, { center: [lat, lon], zoom: 6 });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([lat, lon]).addTo(map);
          }

    function closeProjectModal() {
      document.getElementById('projectModal').style.display = 'none';
    }

    function openModal(subsetor, subsecretaria) {
      modalProjects = allProjects.filter(p => p.subsetor === subsetor && (!subsecretaria || p.subsecretaria === subsecretaria));
      currentModalPage = 0;
      
      document.getElementById('modalTitle').textContent = `Projetos: ${translate(subsetor)}`;
      document.getElementById('cardsModal').style.display = 'block';
      
      renderModalPage();
    }

    function closeModal() {
      document.getElementById('cardsModal').style.display = 'none';
    }

    function renderModalPage() {
      const container = document.getElementById('modalCardsContainer');
      const startIndex = currentModalPage * CARDS_PER_PAGE;
      const endIndex = Math.min(startIndex + CARDS_PER_PAGE, modalProjects.length);
      const pageProjects = modalProjects.slice(startIndex, endIndex);
      
      document.getElementById('modalInfo').textContent = `Mostrando projetos ${startIndex + 1}-${endIndex} de ${modalProjects.length}`;
      
      container.innerHTML = `<div class="cards-grid">
        ${pageProjects.map(project => cardTemplate(project)).join('')}
      </div>`;
      
      document.getElementById('prevBtn').disabled = currentModalPage === 0;
      document.getElementById('nextBtn').disabled = endIndex >= modalProjects.length;
    }

    function changeModalPage(delta) {
      currentModalPage += delta;
      renderModalPage();
    }

    // Favoritos
    async function toggleFavorite(guid) {
      const idx = favorites.indexOf(guid);
      const add = idx === -1;
      favorites = await window.favoritesApi.setFavorite(guid, add);
      
      // Re-renderizar se estamos em um subsetor
      if (currentSubsetor) {
        renderSubsetorContent();
      }
    }

    // Exportar PDF
    async function exportToPDF() {
      const content = document.getElementById('content');
      if (!content || content.querySelector('.loading')) {
        alert('Nenhum conteúdo disponível para exportar. Selecione um subsetor primeiro.');
        return;
      }
      
      const folhas = content.querySelectorAll('.folha-section');
      if (!folhas.length) {
        alert('Nenhum conteúdo disponível para exportar.');
        return;
      }
      
      const pdf = new window.jspdf.jsPDF({
        orientation: 'landscape',
        unit: 'pt',
        format: 'a4'
      });
      
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      
      // Adicionar capa
      const capaImg = new window.Image();
      capaImg.src = 'assets/CAPA.pptx.png';
      try {
        await new Promise((resolve, reject) => {
          capaImg.onload = resolve;
          capaImg.onerror = reject;
        });
        
        const capaRatio = capaImg.width / capaImg.height;
        let capaW = pageWidth * 0.9;
        let capaH = capaW / capaRatio;
        if (capaH > pageHeight * 0.9) {
          capaH = pageHeight * 0.9;
          capaW = capaH * capaRatio;
        }
        pdf.addImage(capaImg, 'PNG', (pageWidth-capaW)/2, 40, capaW, capaH);
      } catch(e) {
        // Sem capa, continuar
      }
      
      pdf.addPage();
      pdf.setFontSize(24);
      pdf.setTextColor(30, 64, 175);
      pdf.text('Resumo por Subsetor', pageWidth/2, 60, { align: 'center' });
      pdf.setFontSize(14);
      pdf.setTextColor(107, 114, 128);
      pdf.text(`Subsetor: ${translate(currentSubsetor)}`, pageWidth/2, 85, { align: 'center' });
      pdf.text(`Gerado em ${new Date().toLocaleDateString('pt-BR')}`, pageWidth/2, 105, { align: 'center' });
      
      // Exportar cada folha
      for (let i = 0; i < folhas.length; i++) {
        const folha = folhas[i];
        
        // Congelar mapas
        await freezeMaps(folha);
        
        const clone = folha.cloneNode(true);
        clone.classList.add('pdf-export');
        clone.style.margin = '0';
        clone.style.borderRadius = '0';
        clone.style.width = '1800px';
        
        const tempDiv = document.createElement('div');
        tempDiv.style.position = 'absolute';
        tempDiv.style.left = '-9999px';
        tempDiv.style.top = '0';
        tempDiv.appendChild(clone);
        document.body.appendChild(tempDiv);
        
        try {
          const canvas = await window.html2canvas(clone, {
            scale: 1.5,
            useCORS: true,
            logging: false,
            width: 1800
          });
          
          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          
          let imgWidth = pageWidth * 0.99;
          let imgHeight = (canvas.height / canvas.width) * imgWidth;
          if (imgHeight > pageHeight * 0.99) {
            imgHeight = pageHeight * 0.99;
            imgWidth = (canvas.width / canvas.height) * imgHeight;
          }
          
          let x = (pageWidth - imgWidth) / 2;
          let y = (pageHeight - imgHeight) / 2;
          
          pdf.addImage(imgData, 'JPEG', x, y, imgWidth, imgHeight);
        } catch(e) {
          console.error('Erro ao exportar folha:', e);
        }
        
        document.body.removeChild(tempDiv);
        
        if (i < folhas.length - 1) pdf.addPage();
      }
      
      pdf.save(`resumo-${currentSubsetor}-ppi.pdf`);
    }

    async function freezeMaps(root) {
      const maps = root.querySelectorAll('.mini-map');
      const tasks = Array.from(maps).map(el => new Promise(resolve => {
        try {
          const map = el._leaflet_map;
          if (!map) return resolve();
          
          setTimeout(() => {
            try {
              window.leafletImage(map, (err, canvas) => {
                if (err || !canvas) return resolve();
                const img = document.createElement('img');
                img.src = canvas.toDataURL('image/png');
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.display = 'block';
                el.innerHTML = '';
                el.appendChild(img);
                try { map.remove(); } catch(e){}
                el._leaflet_map = null;
                resolve();
              });
            } catch(e) { resolve(); }
          }, 40);
        } catch(e) { resolve(); }
      }));
      await Promise.all(tasks);
    }

    window.addEventListener('click', function(event) {
      const cardsModal = document.getElementById('cardsModal');
      const projectModal = document.getElementById('projectModal');
      if (event.target === cardsModal) closeModal();
      if (event.target === projectModal) closeProjectModal();
    });
  </script>
